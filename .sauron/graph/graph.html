<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sauron Codebase Knowledge Graph</title>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --accent-ring: #f59e0b;
      --border-color: #30363d;
      --node-god: #ef4444;
      --node-standard: #3b82f6;
      --node-leaf: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-ring);
      font-size: 16px;
    }
    .metrics {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .metric-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .metric-value {
      font-weight: 700;
      color: #fff;
    }
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
    }
    #sidebar {
      width: 340px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .search-box input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }
    .list-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .node-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      border: 1px solid transparent;
    }
    .node-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .node-item.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent-ring);
    }
    .node-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }
    .node-degree {
      color: var(--text-muted);
      font-size: 11px;
    }
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #161a23 0%, #0d0f14 100%);
    }
    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    .edge {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.2;
      transition: stroke 0.2s;
    }
    .edge.highlighted {
      stroke: var(--accent-ring);
      stroke-width: 2.2;
    }
    .node-circle {
      cursor: pointer;
      transition: r 0.2s, stroke 0.2s;
    }
    .node-circle:hover {
      stroke: #fff;
      stroke-width: 2.5px;
    }
    .node-text {
      fill: var(--text-muted);
      font-size: 10px;
      pointer-events: none;
    }
    #details {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }
    #details h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--accent-ring);
      word-break: break-all;
    }
    #details p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
  </style>
</head>

rce":"Fixlinkmobile/mobile/src/types/index.tsx","target":"Fixlinkmobile/mobile/src/types/job.tsx"},{"source":"Fixlinkmobile/mobile/src/types/index.tsx","target":"Fixlinkmobile/mobile/src/types/message.tsx"},{"source":"Fixlinkmobile/mobile/src/types/index.tsx","target":"Fixlinkmobile/mobile/src/types/schedule.tsx"},{"source":"fixlinkweb admin/backend/src/routes/admin.js","target":"fixlinkweb admin/backend/src/config/supabase.js"},{"source":"fixlinkweb admin/backend/src/routes/auth.js","target":"fixlinkweb admin/backend/src/config/supabase.js"},{"source":"fixlinkweb admin/backend/src/routes/users.js","target":"fixlinkweb admin/backend/src/config/supabase.js"},{"source":"fixlinkweb admin/backend/src/server.js","target":"fixlinkweb admin/backend/src/routes/auth.js"},{"source":"fixlinkweb admin/backend/src/server.js","target":"fixlinkweb admin/backend/src/routes/users.js"},{"source":"fixlinkweb admin/backend/src/server.js","target":"fixlinkweb admin/backend/src/routes/admin.js"}],"cycles":[]};
    document.getElementById("m-nodes").textContent = data.nodes.length;
    document.getElementById("m-edges").textContent = data.edges.length;
    document.getElementById("m-cycles").textContent = data.cycles.length;
    document.getElementById("m-gods").textContent = data.nodes.filter(n => n.totalDegree > 10).length;

    const svg = document.getElementById("graphSvg");
    const group = document.getElementById("transformGroup");
    const edgesGroup = document.getElementById("edgesGroup");
    const nodesGroup = document.getElementById("nodesGroup");
    const nodeList = document.getElementById("nodeList");

    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const width = svg.clientWidth || 800;
    const height = svg.clientHeight || 600;
    panX = width / 2;
    panY = height / 2;

    function updateTransform() {
      group.setAttribute("transform", `translate(${panX}, ${panY}) scale(${zoom})`);
    }
    updateTransform();

    svg.addEventListener("mousedown", (e) => {
      if (e.target === svg || e.target.tagName === "svg" || e.target.id === "viewport") {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    svg.addEventListener("wheel", (e) => {
      e.preventDefault();
      const scaleFactor = 1.1;
      if (e.deltaY < 0) {
        zoom *= scaleFactor;
      } else {
        zoom /= scaleFactor;
      }
      zoom = Math.max(0.1, Math.min(zoom, 5));
      updateTransform();
    });

    const angleStep = (2 * Math.PI) / Math.max(data.nodes.length, 1);
    const radius = Math.min(width, height) * 0.9 + (data.nodes.length * 5);

    const positions = new Map();
    data.nodes.forEach((node, i) => {
      const angle = i * angleStep;
      const x = Math.cos(angle) * (radius * (0.4 + (i % 3) * 0.3));
      const y = Math.sin(angle) * (radius * (0.4 + (i % 3) * 0.3));
      positions.set(node.id, { x, y });
    });

    data.edges.forEach((edge) => {
      const sPos = positions.get(edge.source);
      const tPos = positions.get(edge.target);
      if (sPos && tPos) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", sPos.x);
        line.setAttribute("y1", sPos.y);
        line.setAttribute("x2", tPos.x);
        line.setAttribute("y2", tPos.y);
        line.setAttribute("class", "edge");
        line.dataset.source = edge.source;
        line.dataset.target = edge.target;
        edgesGroup.appendChild(line);
      }
    });

    data.nodes.forEach((node) => {
      const pos = positions.get(node.id);
      if (!pos) return;

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");

      let color = "var(--node-standard)";
      if (node.totalDegree > 10) {
        color = "var(--node-god)";
      } else if (node.outDegree === 0) {
        color = "var(--node-leaf)";
      }

      const r = Math.max(5, Math.min(18, 5 + node.totalDegree * 1.2));
      circle.setAttribute("cx", pos.x);
      circle.setAttribute("cy", pos.y);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", color);
      circle.setAttribute("class", "node-circle");
      circle.dataset.id = node.id;

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", pos.x + r + 4);
      text.setAttribute("y", pos.y + 4);
      text.setAttribute("class", "node-text");
      text.textContent = node.id.split("/").pop();

      g.appendChild(circle);
      g.appendChild(text);
      nodesGroup.appendChild(g);

      g.addEventListener("click", () => selectNode(node.id));
    });

    function renderList(filter = "") {
      nodeList.innerHTML = "";
      const lower = filter.toLowerCase();
      data.nodes
        .filter(n => n.id.toLowerCase().includes(lower))
        .sort((a, b) => b.totalDegree - a.totalDegree)
        .forEach(node => {
          const item = document.createElement("div");
          item.className = "node-item";
          item.id = "list-" + btoa(node.id).replace(/=/g, "");
          item.innerHTML = `<span class="node-label" title="${node.id}">${node.id}</span><span class="node-degree">deg:${node.totalDegree}</span>`;
          item.addEventListener("click", () => selectNode(node.id));
          nodeList.appendChild(item);
        });
    }

    renderList();

    document.getElementById("filterInput").addEventListener("input", (e) => {
      renderList(e.target.value);
    });

    function selectNode(id) {
      document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
      const safeId = "list-" + btoa(id).replace(/=/g, "");
      const foundItem = document.getElementById(safeId);
      if (foundItem) {
        foundItem.classList.add("active");
        foundItem.scrollIntoView({ block: "nearest" });
      }

      document.querySelectorAll(".edge").forEach(edge => {
        if (edge.dataset.source === id || edge.dataset.target === id) {
          edge.classList.add("highlighted");
        } else {
          edge.classList.remove("highlighted");
        }
      });

      const node = data.nodes.find(n => n.id === id);
      const details = document.getElementById("details");
      if (node) {
        details.style.display = "block";
        document.getElementById("det-id").textContent = node.id;
        document.getElementById("det-degree").textContent = `Degree: ${node.totalDegree} (in: ${node.inDegree}, out: ${node.outDegree})`;
        document.getElementById("det-symbols").textContent = `Symbols: ${node.symbols.length}`;
        document.getElementById("det-imports").textContent = `Direct Outgoing: ${node.outDegree}`;
      }
    }
  </script>
