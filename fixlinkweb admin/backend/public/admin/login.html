<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixLink Admin - Sign in</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230F766E'/%3E%3Cstop offset='1' stop-color='%23075E59'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath fill='%23fff' transform='translate(0.5 0.5) scale(0.958)' d='M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 6.7C.4 9.1.9 12.1 2.9 14.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #102A43; --teal: #0F766E; --teal-dark: #075E59; --teal-light: #E6F6F3; --canvas: #F5F8FA; --white: #FFFFFF; --muted: #3F5A6E; --line: #D9E2EC; --line-soft: #E3ECF2; --danger: #E53935; --hud-grid: rgba(15,118,110,0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::selection { background: rgba(15,118,110,0.18); }
        :focus-visible { outline: 3px solid rgba(15,118,110,0.22); outline-offset: 2px; }
        body { display: grid; min-height: 100vh; place-items: center; background: var(--canvas); background-image: radial-gradient(circle at 1px 1px, var(--hud-grid) 1px, transparent 0), linear-gradient(135deg, rgba(15, 118, 110, 0.05), transparent 42%), linear-gradient(315deg, rgba(7, 94, 89, 0.04), transparent 48%); background-size: 22px 22px, auto, auto; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); }
        .login-card { width: min(440px, calc(100% - 2rem)); background: var(--white); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 20px 55px rgba(16, 42, 67, 0.1), 0 1px 0 rgba(15,118,110,0.08) inset; padding: 2.5rem 2rem; }
        .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 2.5rem; }
        .logo { display: grid; place-items: center; width: 54px; height: 54px; background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: #fff; border-radius: 16px; margin-bottom: 0.9rem; }
        .logo svg { width: 26px; height: 26px; fill: currentColor; }
        .brand-name { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
        .brand-name span { color: var(--teal); }
        .heading { text-align: center; margin-bottom: 2rem; }
        .eyebrow { display: block; color: var(--teal); font-size: 0.70rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; margin-bottom: 0.6rem; }
        h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .subtitle { color: var(--muted); font-size: 0.88rem; }
        label { display: block; margin: 1rem 0 0.4rem; font-size: 0.82rem; font-weight: 700; }
        input { width: 100%; padding: 0.85rem 0.9rem; color: var(--ink); background: #FBFDFE; border: 1px solid var(--line); border-radius: 13px; font: inherit; font-size: 0.92rem; }
        input:focus { outline: 3px solid rgba(15, 118, 110, 0.18); border-color: var(--teal); }
        button { width: 100%; margin-top: 1.6rem; padding: 0.88rem; color: #fff; background: var(--teal); border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: background 0.15s; }
        button:hover { background: var(--teal-dark); }
        .error { min-height: 1.2rem; margin-top: 1rem; color: var(--danger); font-size: 0.82rem; text-align: center; }
        .admin-label { display: block; text-align: center; margin-top: 1.6rem; color: var(--muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 6.7C.4 9.1.9 12.1 2.9 14.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg></div>
            <div class="brand-name">FIX<span>LINK</span></div>
        </div>
        <div class="heading"><span class="eyebrow">Secure workspace</span><h2>Welcome back</h2><p class="subtitle">Sign in to manage the FixLink marketplace.</p></div>
        <form id="loginForm">
            <label for="username">Admin username</label><input id="username" autocomplete="username" required>
            <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in to dashboard</button>
            <p class="error" id="error" role="alert"></p>
        </form>
        <span class="admin-label">Admin access only</span>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const error = document.getElementById('error');
        form.addEventListener('submit', async event => {
            event.preventDefault(); error.textContent = '';
            try {
                const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to sign in');
                window.location.href = '/admin/technicians.html';
            } catch (loginError) { error.textContent = loginError.message; }
        });
    </script>
</body>
</html>
